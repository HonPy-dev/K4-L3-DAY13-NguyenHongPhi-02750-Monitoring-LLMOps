alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'percentile(response_sent.latency_ms, 95) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: oncall-llm
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: oncall-llm
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudgetBurn
    severity: warning
    condition: 'sum(response_sent.cost_usd) over 24h > 2.5'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: oncall-llm
    runbook: docs/alerts.md#alert-3
